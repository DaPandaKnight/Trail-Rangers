<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NZ Terrain Explorer</title>
  <link rel="icon" type="image/png" href="./images/RWIcon.png">

  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="Styling.css">
</head>

<body>

  <div class="coord-display" id="coords">Move cursor over map to show coordinates</div>

  <div id="map"></div>

  <!-- ── NZ place search (top-right, click to expand) ────────────────── -->
  <div class="map-search" id="search" role="search">
    <div class="search-shell">

      <button type="button" class="search-toggle" id="search-toggle" aria-label="Search New Zealand"
        aria-expanded="false" aria-controls="search-results">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.75"></circle>
          <line x1="15.6" y1="15.6" x2="20.5" y2="20.5"></line>
        </svg>
      </button>

      <input type="text" class="search-input" id="search-input" placeholder="Search New Zealand" autocomplete="off"
        autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" role="combobox"
        aria-autocomplete="list" aria-expanded="false" aria-controls="search-results" tabindex="-1" />

      <div class="search-spinner" id="search-spinner" hidden aria-hidden="true"></div>

      <button type="button" class="search-clear" id="search-clear" aria-label="Clear search" tabindex="-1" hidden>
        &times;
      </button>

    </div>

    <div class="search-results" id="search-results" role="listbox" aria-label="Search results" hidden></div>
  </div>

  <div id="panel">

    <div class="panel-logo">
      <img src="./images/RWMainLogo.png" alt="RidgeWalker">
    </div>

    <div>
      <div class="panel-section-label">Base Layer</div>
      <div class="layer-row">
        <span class="layer-name">Aerial Imagery</span>
        <label class="toggle">
          <input type="checkbox" id="toggle-aerial" checked />
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div>
      <div class="panel-section-label">Overlay</div>
      <div class="layer-row">
        <span class="layer-name">Topographic Map</span>
        <label class="toggle">
          <input type="checkbox" id="toggle-topo" checked />
          <span class="toggle-slider"></span>
        </label>
        <br>
      </div>

      <div class="opacity-row">
        <div class="opacity-header">
          <span class="panel-section-label">Topo Opacity</span>
          <span class="opacity-val" id="opacity-val">60%</span>
        </div>
        <input type="range" id="topo-opacity" min="0" max="100" value="60" />
      </div>
    </div>

    <div>
      <div class="panel-section-label">Route</div>

      <!-- Route mode switch -->
      <div class="mode-switch" id="mode-switch" role="tablist" aria-label="Route planning mode">
        <button type="button" class="mode-option is-active" data-mode="fixed" role="tab" aria-selected="true">
          <svg class="mode-icon" viewBox="0 0 64 34" width="64" height="34" aria-hidden="true">
            <path class="mode-path" d="M8 26 C 20 8, 34 30, 56 10" />
            <circle class="mode-dot mode-dot-start" cx="8" cy="26" r="4.5" />
            <circle class="mode-dot mode-dot-end" cx="56" cy="10" r="4.5" />
          </svg>
          <span class="mode-label">2-Point</span>
        </button>

        <button type="button" class="mode-option" data-mode="multi" role="tab" aria-selected="false">
          <svg class="mode-icon" viewBox="0 0 64 34" width="64" height="34" aria-hidden="true">
            <path class="mode-path" d="M6 30 C9 14 15 1 20 4 C28 8 37 26 45 30 C50 34 55 10 58 4" />
            <circle class="mode-dot mode-dot-start" cx="6" cy="30" r="4" />
            <circle class="mode-dot mode-dot-via" cx="18" cy="4" r="4" />
            <circle class="mode-dot mode-dot-via" cx="45" cy="30" r="4" />
            <circle class="mode-dot mode-dot-end" cx="58" cy="4" r="4" />
          </svg>
          <span class="mode-label">Multi-Point</span>
        </button>
      </div>

      <p class="route-hint" id="route-hint">Press 'Start Pin' to place your starting point</p>

      <!-- Fixed 2-point mode -->
      <div id="mode-fixed">
        <div class="route-points" id="fixed-points-list" hidden>
          <div class="route-point-row" id="point-a-row" hidden>
            <span class="point-dot point-dot-start" id="point-a-dot"></span>
            <span class="point-label">Start</span>
            <span class="point-coords" id="point-a-coords">Not set</span>
          </div>
          <div class="route-point-row" id="point-b-row" hidden>
            <span class="point-dot point-dot-end" id="point-b-dot"></span>
            <span class="point-label">End</span>
            <span class="point-coords" id="point-b-coords">Not set</span>
          </div>
        </div>

        <div class="route-actions">
          <button class="btn-secondary btn-start" id="place-start">Start Pin</button>
          <button class="btn-secondary btn-end" id="place-end">End Pin</button>
        </div>
      </div>

      <!-- Multi-waypoint mode -->
      <div id="mode-multi" hidden>
        <div class="route-points" id="route-points"></div>

        <div class="route-actions">
          <button class="btn-secondary" id="add-waypoint">+ Add Waypoint</button>
        </div>
      </div>

      <div class="route-actions">
        <button class="btn-primary" id="generate-route" disabled>Generate Route</button>
        <button class="btn-secondary" id="clear-route">Clear</button>
      </div>

      <div class="route-stats" id="route-stats" hidden>
        <div class="route-stat">
          <span class="route-stat-label">Distance</span>
          <span class="route-stat-value" id="stat-distance">—</span>
        </div>
        <div class="route-stat">
          <span class="route-stat-label">Est. time</span>
          <span class="route-stat-value" id="stat-time">—</span>
        </div>
        <div class="route-stat">
          <span class="route-stat-label">Climb</span>
          <span class="route-stat-value" id="stat-climb">—</span>
        </div>
      </div>

      <div class="route-error" id="route-error" hidden></div>
    </div>

    <button id="export-gpx" class="btn-secondary" disabled>
      Export Route as .GPX File
    </button>

  </div>

  <!-- RidgeWalker Loading Screen -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-content">
      <div class="loader"></div>

      <h2>Finding your route...</h2>
      <p id="loading-message">
        RidgeWalker is analysing the terrain.
      </p>
    </div>
  </div>

  <script src="MapLogic.js" defer></script>
</body>

</html>
